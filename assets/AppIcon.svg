<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2E35"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9EEF5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#FF6A2B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS squircle tile: 824 px body inside the 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <!-- four limits: tracks + used share -->
  <g>
    <rect x="232" y="292" width="560" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="232" y="292" width="190" height="64" rx="32" fill="url(#fill)"/>

    <rect x="232" y="412" width="560" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="232" y="412" width="480" height="64" rx="32" fill="url(#hot)"/>

    <rect x="232" y="532" width="560" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="232" y="532" width="300" height="64" rx="32" fill="url(#fill)"/>

    <rect x="232" y="652" width="560" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="232" y="652" width="110" height="64" rx="32" fill="url(#fill)"/>
  </g>
</svg>
